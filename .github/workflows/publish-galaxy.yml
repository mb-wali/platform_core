name: Publish Ansible Collection

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - pre0.1.1

  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Ansible Galaxy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible and PyYAML
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core pyyaml

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python - <<'PY'
          import yaml

          with open("galaxy.yml") as f:
              print(yaml.safe_load(f)["version"])
          PY
          )

          EXPECTED="${TAG#v}"

          echo "galaxy.yml version: $VERSION"
          echo "Git tag version:    $EXPECTED"

          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "::error::Version mismatch: galaxy.yml=$VERSION, tag=$EXPECTED"
            exit 1
          fi

          echo "Version $VERSION matches tag $TAG"

      - name: Build collection
        run: |
          ansible-galaxy collection build --force

      - name: Publish to Ansible Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          ansible-galaxy collection publish \
            mb_wali-platform_core-*.tar.gz \
            --api-key "$GALAXY_API_KEY"
