argocd_namespace: "argocd"
argocd_helm_version: "9.1.7"
argocd_version: "v3.2.1"  # https://github.com/argoproj/argo-cd/releases
argocd_hostname: "argocd.example.com"
argocd_oidc_issuer: https://keycloak.example.com/auth/realms/test
argocd_oidc_client: argocd
argocd_oidc_clientSecret: <client_secret>
argocd_oidc_scopes: [groups, email]
argocd_avp_version: 1.18.1 # https://github.com/argoproj-labs/argocd-vault-plugin/releases
argocd_avp_image: mbwali/argocd-avp

# Admin role for argocd
argocd_admin_role: admin_rolename

# Summary of Updated Permissions for argocd_dev_role role:project-admins:
# Applications and Projects: Full access to manage all applications and projects.
# Repositories: Can view and list all repositories but cannot create or update them.
# Clusters: Can view and list all clusters but cannot create or update them.
# Default Project: Can only view the default project, but cannot modify it in any way.
argocd_dev_role: dev_rolename

# This allows deleting any Pod managed by the inveniordm application in project dev.
## project/application
argocd_allow_pod_deletion_application: dev/inveniordm

## Gitub app credentials
argocd_github_app_secret: <github_app_secret_name>
argocd_repositories_default_url: https://github.com/test/example.git
argocd_repositories_default_appId: "2285784"
argocd_repositories_default_installationId: "94540400"
argocd_repositories_default_privateKey: <inline_base64_key> # base64 -w 0 private-key.pem 
argocd_repositories_default_type: git

# group name controls the project created above
argocd_inveniordm_role: dev_inveniordm

# group name controls the project created above
argocd_lcalyze_role: dev_lcalyze

# damap
argocd_dmp_role: dev_dmp

# elabftw
argocd_elabftw_role: dev_elabftw

## Repositories
### Adding harbor helm repository as trusted
argocd_repo_helm_url: harbor.k3s.example.com
argocd_extern_registry_username: "<USERNAME>"
argocd_extern_registry_password: "<SECRET_KEY>"

# Deny other targetRevision
# except: main and v*
argocd_target_revision_policy: false

# enable argocd apps
argocd_apps: false
argocd_apps_version: 2.0.5

# projects
