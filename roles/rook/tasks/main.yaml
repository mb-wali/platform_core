# Creates the CephCluster CR that the Rook operator will configure.
- name: Install or upgrade rook-ceph-cluster
  kubernetes.core.helm:
    name: rook-ceph-cluster
    chart_ref: rook-release/rook-ceph-cluster
    chart_version: "{{ rook_helm_version }}"
    release_namespace: rook-ceph
    create_namespace: true
    values_files:
      - /tmp/rook/values.yaml
    state: present

# Wait for CephCluster to become Ready
- name: Wait for CephCluster to be ready
  kubernetes.core.k8s_info:
    api_version: ceph.rook.io/v1
    kind: CephCluster
    namespace: rook-ceph
    name: rook-ceph
  register: ceph_cluster
  retries: 60
  delay: 15
  until: >
    ceph_cluster.resources | length > 0 and
    ceph_cluster.resources[0].status.phase | default('') == 'Ready'
