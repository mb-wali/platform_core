---
###################################
#################### ArgoCD APPS ##
###################################

##################################
##################################
- name: Include apps tasks
  import_tasks: apps.yaml

- name: Ensure ArgoCD Apps values directory exists
  ansible.builtin.file:
    path: /tmp/argocdapps
    state: directory
    mode: "0755"

- name: Render ArgoCD values file
  ansible.builtin.template:
    src: values-apps.yaml.j2
    dest: /tmp/argocdapps/values-apps.yaml
    mode: "0644"

- name: Add ArgoCD apps Helm repo
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Install or upgrade ArgoCD Apps
  kubernetes.core.helm:
    name: argocdapps
    chart_ref: argo/argocd-apps
    chart_version: "{{ argocd_apps_version }}"
    release_namespace: argocd
    create_namespace: true
    values_files:
      - /tmp/argocdapps/values-apps.yaml
    state: present
