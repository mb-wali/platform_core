ceph_csi_helm_version: "3.15.0"
ceph_csi_subnet: "192.27.128"
ceph_csi_cluster_id: "<ceph-cluster-id>"

########## CEPH RBD
ceph_csi_rbd_user_id: "<ceph-user-id>"
ceph_csi_rbd_user_key: "<ceph-user-key>"

# for upgrade set this to false
## avoid recreating storageclass
ceph_csi_storageclass_create: true

# provisioner replicas - number of replicas for RBD provisioner
ceph_csi_rbd_provisioner_replica: 1


############ CEPH FS
ceph_csi_fs_enable: false
ceph_csi_fs_user_id: "<ceph-user-id>"
ceph_csi_fs_user_key: "<ceph-user-key>"
ceph_csi_fs_provisioner_replica: 1
ceph_csi_fs_subvolumegroup_name: mygroup
